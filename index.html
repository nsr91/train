<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="robots" content="noindex, nofollow">
<title>Train</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view" aria-live="polite"></main>
<div id="timer" class="timer hidden" role="timer">
  <button class="tbtn" data-act="t-minus" aria-label="Minus 15 seconds">−15</button>
  <div class="tmid"><div class="tlabel">Rest</div><div id="tval" class="tval">0:00</div></div>
  <button class="tbtn" data-act="t-plus" aria-label="Plus 15 seconds">+15</button>
  <button class="tbtn" data-act="t-skip">Skip</button>
</div>
<nav class="tabs">
  <a href="#/" data-tab="home"><span class="ico">◉</span>Today</a>
  <a href="#/progress" data-tab="progress"><span class="ico">↗</span>Progress</a>
  <a href="#/library" data-tab="library"><span class="ico">≣</span>Exercises</a>
  <a href="#/settings" data-tab="settings"><span class="ico">⚙</span>Settings</a>
</nav>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden"></div>
<script src="vendor/xlsx.mini.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
